[package]
name = "q"
version = "0.2.3"
edition = "2021"
description = "CLI tool for quick, one-shot Gemini queries with no API key required"
license = "MIT"
repository = "https://github.com/jarpex/q"
readme = "README.md"
keywords = ["cli", "ai", "gemini", "assistant", "llm"]
categories = ["command-line-utilities"]
authors = ["Anastasia Shebalkina"]

[features]
default = []
fuzzing = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
exit = "deny"

print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
needless_pass_by_value = "warn"
shadow_reuse = "warn"
shadow_same = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

or_fun_call = "warn"
str_to_string = "warn"
rc_buffer = "warn"
mutex_atomic = "warn"
map_unwrap_or = "warn"

multiple_crate_versions = "allow"
module_name_repetitions = "allow"
redundant_pub_crate = "allow"
must_use_candidate = "allow"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
anyhow = "1.0.104"

# Webview
wry = "0.57"
tao = "0.37.1"

# Clipboard
arboard = "3.6.1"

# TUI
crossterm = "0.29.0"
unicode-linebreak = "0.1.5"
unicode-width = "0.2.2"
