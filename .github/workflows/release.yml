name: Release Automation

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag of the release, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: q

jobs:
  check-tag:
    name: Check the Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          path: release

      - name: Checkout the sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: sources

      - name: Check the tag against the version
        id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(Q_MANIFEST=release/Cargo.toml Q_MAN_PAGE=release/man/q.1 \
            sources/scripts/check-release-tag.sh "$TAG")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  gate:
    name: Security & Compliance Gates
    needs: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies (Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
                                  librsvg2-dev libssl-dev libxdo-dev libglib2.0-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy (Strict)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --all-features

      - name: Run cargo audit (Gate)
        run: cargo audit --deny warnings --file .cargo/audit.toml

      - name: Run cargo deny (Gate)
        run: cargo deny check licenses bans sources

  build:
    name: Build (${{ matrix.asset_name }})
    needs: [check-tag, gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: q-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: q-linux-arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            asset_name: q-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: q-macos-apple-silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: q-windows-amd64
            archive: zip
          - os: windows-latest
            target: i686-pc-windows-msvc
            asset_name: q-windows-i686
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_name: q-windows-arm64
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
                                  librsvg2-dev libssl-dev libxdo-dev libglib2.0-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare asset
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-asset.sh \
            "${{ matrix.target }}" \
            "${{ matrix.asset_name }}" \
            "${{ matrix.archive || 'tar.gz' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.archive || 'tar.gz' }}
          retention-days: 7

  universal-macos:
    name: Create macOS Universal Binary
    needs: [check-tag, build]
    runs-on: macos-latest
    steps:
      - name: Download Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: q-macos-intel
          path: artifacts/intel

      - name: Download Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: q-macos-apple-silicon
          path: artifacts/arm

      - name: Extract and merge binaries (lipo)
        run: |
          mkdir -p temp-intel temp-arm dist
          tar -xzf artifacts/intel/q-macos-intel.tar.gz -C temp-intel
          tar -xzf artifacts/arm/q-macos-apple-silicon.tar.gz -C temp-arm

          # Merge both architectures into one universal binary
          lipo -create -output dist/${{ env.BIN_NAME }} temp-intel/${{ env.BIN_NAME }} temp-arm/${{ env.BIN_NAME }}

          cp temp-intel/README.md dist/ || true
          cp temp-intel/LICENSE dist/ || true
          cp -r temp-intel/man dist/ || true

          tar -czvf q-macos-universal.tar.gz -C dist .

      - name: Upload Universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-macos-universal
          path: q-macos-universal.tar.gz
          retention-days: 7

  publish:
    name: Publish Release
    needs: [check-tag, build, universal-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.check-tag.outputs.tag }}

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: q-*
          merge-multiple: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate Release Notes
        run: |
          # The notes of the tag that is released, not of the newest tag.
          git-cliff --current --strip header -o RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Check that the release is not out yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ needs.check-tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "the release ${{ needs.check-tag.outputs.tag }} is already out" >&2
            echo "a new build would change the archives and break the formula" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-tag.outputs.tag }}
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  formula:
    name: Update the Homebrew Formula
    needs: [check-tag, publish]
    uses: ./.github/workflows/update-formula.yml
    with:
      tag: ${{ needs.check-tag.outputs.tag }}
    secrets: inherit
