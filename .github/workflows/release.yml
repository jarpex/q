name: Release Automation

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*', '*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: q

jobs:
  check-tag:
    name: Check for Release Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if current commit has a tag
        id: check
        run: |
          TAG=$(git tag --points-at HEAD | head -n 1)
          if [ -n "$TAG" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  gate:
    name: Security & Compliance Gates
    needs: check-tag
    if: needs.check-tag.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies (Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
                                  librsvg2-dev libssl-dev libxdo-dev libglib2.0-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy (Strict)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --all-features

      - name: Run cargo audit (Gate)
        run: cargo audit --deny warnings --file .cargo/audit.toml

      - name: Run cargo deny (Gate)
        run: cargo deny check licenses bans sources

  build:
    name: Build (${{ matrix.asset_name }})
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: q-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: q-linux-arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            asset_name: q-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: q-macos-apple-silicon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
                                  librsvg2-dev libssl-dev libxdo-dev libglib2.0-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare asset
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ env.BIN_NAME }}"
          cp "$BIN_PATH" dist/${{ env.BIN_NAME }}
          cp README.md LICENSE dist/ || true
          tar -czvf ${{ matrix.asset_name }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz
          retention-days: 7

  universal-macos:
    name: Create macOS Universal Binary
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: q-macos-intel
          path: artifacts/intel

      - name: Download Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: q-macos-apple-silicon
          path: artifacts/arm

      - name: Extract and merge binaries (lipo)
        run: |
          mkdir -p temp-intel temp-arm dist
          tar -xzf artifacts/intel/q-macos-intel.tar.gz -C temp-intel
          tar -xzf artifacts/arm/q-macos-apple-silicon.tar.gz -C temp-arm

          # Склейка двух архитектур в один Universal Binary
          lipo -create -output dist/${{ env.BIN_NAME }} temp-intel/${{ env.BIN_NAME }} temp-arm/${{ env.BIN_NAME }}

          cp temp-intel/README.md dist/ || true
          cp temp-intel/LICENSE dist/ || true

          tar -czvf q-macos-universal.tar.gz -C dist .

      - name: Upload Universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: q-macos-universal
          path: q-macos-universal.tar.gz
          retention-days: 7

  publish:
    name: Publish Release
    needs: [check-tag, build, universal-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: q-*
          merge-multiple: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate Release Notes
        run: |
          git-cliff --latest --strip header -o RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-tag.outputs.tag_name || github.ref_name }}
          files: artifacts/*.tar.gz
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
